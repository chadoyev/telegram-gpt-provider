services:
  bot:
    image: chadoyev/uai-robot:latest
    build: .
    container_name: uai_robot_bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEBHOOK_PORT:-8443}:8443"
    volumes:
      - bot_data:/app/users
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uai_network

  postgres:
    image: postgres:16-alpine
    container_name: uai_robot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uai_robot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - uai_network

volumes:
  pg_data:
  bot_data:

networks:
  uai_network:
    driver: bridge
